<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
  </defs>
  <!-- Background Crest -->
  <circle cx="50" cy="50" r="47" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="43.5" fill="none" stroke="#22c55e" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.6" />
  
  <!-- Rolling Lawn Hills -->
  <path d="M 15 72 Q 35 62, 55 68 Q 75 74, 85 70 L 85 80 Q 50 88, 15 80 Z" fill="#166534" />
  <path d="M 18 76 Q 40 68, 65 72 Q 80 75, 82 78 L 82 81 Q 50 87, 18 81 Z" fill="#22c55e" opacity="0.4" />
  
  <!-- Tree Trunk & Roots -->
  <path d="M 47 72 L 47 50 Q 42 42, 38 38 L 41 37 Q 47 43, 49 48 L 49 72 Z" fill="url(#goldGrad)" />
  <path d="M 53 72 L 53 48 Q 57 41, 62 37 L 59 36 Q 54 42, 51 47 L 51 72 Z" fill="url(#goldGrad)" />
  <path d="M 45 72 L 43 75 M 55 72 L 57 75" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  
  <!-- Lush Tree Canopies -->
  <circle cx="50" cy="30" r="14" fill="url(#treeGrad)" />
  <circle cx="36" cy="36" r="11" fill="#15803d" />
  <circle cx="64" cy="36" r="11" fill="#16a34a" />
  <circle cx="44" cy="42" r="9" fill="#166534" />
  <circle cx="56" cy="42" r="9" fill="#22c55e" />
  
  <!-- Inner Highlight Leaves -->
  <path d="M 50 22 Q 54 27, 50 32 Q 46 27, 50 22 Z" fill="#86efac" opacity="0.8" />
  <path d="M 37 32 Q 40 36, 37 40 Q 34 36, 37 32 Z" fill="#86efac" opacity="0.7" />
  <path d="M 63 32 Q 66 36, 63 40 Q 60 36, 63 32 Z" fill="#86efac" opacity="0.7" />

  <!-- Gold Star Accent at top -->
  <polygon points="50,9 51.5,12 55,12 52,14 53,17 50,15 47,17 48,14 45,12 48.5,12" fill="url(#goldGrad)" />
</svg>
